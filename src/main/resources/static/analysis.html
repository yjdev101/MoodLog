<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 기분 분석 - MoodLog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>tailwind.config={theme:{extend:{colors:{mint:{50:'#f0fdf8',100:'#ccfbee',200:'#99f6dd',300:'#5eead4',400:'#2dd4bf',500:'#14b8a6',600:'#0d9488',700:'#0f766e'}},fontFamily:{sans:['Noto Sans KR','sans-serif']}}}}</script>
    <style>body{font-family:'Noto Sans KR',sans-serif;}.fade-in{animation:fadeIn 0.5s ease forwards;}@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}</style>
</head>
<body class="bg-mint-50 min-h-screen flex flex-col">

    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button onclick="history.back()" class="w-9 h-9 rounded-full bg-mint-50 hover:bg-mint-100 flex items-center justify-center text-mint-600 transition-colors">⬅</button>
                <span class="font-bold text-gray-800">AI 기분 분석</span>
            </div>
            <a href="/" class="w-9 h-9 rounded-full bg-mint-50 hover:bg-mint-100 flex items-center justify-center text-mint-600 transition-colors">🏠</a>
        </div>
    </header>

    <main class="flex-1 max-w-2xl w-full mx-auto px-4 py-8 flex flex-col gap-5">

        <!-- 로딩 -->
        <div id="loadingSection" class="flex flex-col items-center justify-center py-16 gap-3">
            <div class="text-4xl animate-spin">🤖</div>
            <p class="text-gray-400 text-sm">분석 중입니다... 잠시만 기다려주세요</p>
        </div>

        <!-- 결과 -->
        <div id="resultSection" class="hidden fade-in flex flex-col gap-5">

            <!-- 태그 통계 -->
            <div class="bg-white rounded-2xl shadow-sm border border-mint-100 p-5">
                <p class="text-gray-500 text-sm mb-4">📈 태그 통계</p>
                <div id="tagStats" class="flex flex-col gap-3"></div>
            </div>

            <!-- AI 코멘트 -->
            <div class="bg-white rounded-2xl shadow-sm border border-mint-100 p-5">
                <p class="text-gray-500 text-sm mb-3">🤖 AI 분석 코멘트</p>
                <p id="aiComment" class="text-gray-700 leading-relaxed text-sm"></p>
            </div>

        </div>

        <!-- 기록 없음 -->
        <div id="emptySection" class="hidden fade-in flex flex-col items-center justify-center py-16 gap-4 text-center">
            <span class="text-5xl">📭</span>
            <p class="text-gray-400 text-sm">아직 기록이 없어요.<br>기분을 기록해보세요!</p>
            <a href="/mood/write.html" class="bg-mint-500 text-white px-6 py-2 rounded-xl text-sm font-medium hover:bg-mint-600 transition-colors">기록하기</a>
        </div>

    </main>

    <!-- 하단 네비게이션 -->
    <nav class="bg-white border-t border-gray-100 sticky bottom-0 md:hidden">
        <div class="max-w-2xl mx-auto px-4 py-2 flex justify-around">
            <a href="/" class="flex flex-col items-center gap-1 text-gray-400 hover:text-mint-500 transition-colors"><span class="text-xl">🏠</span><span class="text-xs">홈</span></a>
            <a href="/mood/write.html" class="flex flex-col items-center gap-1 text-gray-400 hover:text-mint-500 transition-colors"><span class="text-xl">✏️</span><span class="text-xs">기록</span></a>
            <a href="/mood/list.html" class="flex flex-col items-center gap-1 text-gray-400 hover:text-mint-500 transition-colors"><span class="text-xl">📋</span><span class="text-xs">목록</span></a>
            <a href="/mypage.html" class="flex flex-col items-center gap-1 text-gray-400 hover:text-mint-500 transition-colors"><span class="text-xl">👤</span><span class="text-xs">마이</span></a>
        </div>
    </nav>

    <script>
        const token = localStorage.getItem("accessToken");
        if (!token) { location.href = "/login.html"; }

        const moodLabel = m => ({ VERY_GOOD:"😄 매우좋음", GOOD:"🙂 좋음", NORMAL:"😐 보통", BAD:"😕 나쁨", VERY_BAD:"😢 매우나쁨" }[m] || m);

        fetch("/api/analysis", { headers: { "Authorization": "Bearer " + token } })
        .then(res => res.json())
        .then(data => {
            document.getElementById("loadingSection").style.display = "none";
            const { tagStats, aiComment } = data;

            if (Object.keys(tagStats).length === 0) {
                document.getElementById("emptySection").style.display = "flex";
                return;
            }

            const tagStatsDiv = document.getElementById("tagStats");
            for (const [tag, moodCounts] of Object.entries(tagStats)) {
                const div = document.createElement("div");
                div.className = "flex flex-col gap-1";
                div.innerHTML = `
                    <p class="text-sm font-medium text-gray-700"># ${tag}</p>
                    <p class="text-xs text-gray-400">${Object.entries(moodCounts).map(([m,c]) => `${moodLabel(m)} ${c}회`).join(" · ")}</p>
                `;
                tagStatsDiv.appendChild(div);
            }

            document.getElementById("aiComment").innerText = aiComment;
            document.getElementById("resultSection").style.display = "flex";
        })
        .catch(() => {
            document.getElementById("loadingSection").style.display = "none";
            document.getElementById("emptySection").style.display = "flex";
        });
    </script>
</body>
</html>
