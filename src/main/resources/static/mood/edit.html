<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기록 수정 - MoodLog</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>tailwind.config={theme:{extend:{colors:{mint:{50:'#f0fdf8',100:'#ccfbee',200:'#99f6dd',300:'#5eead4',400:'#2dd4bf',500:'#14b8a6',600:'#0d9488',700:'#0f766e'}},fontFamily:{sans:['Noto Sans KR','sans-serif']}}}}</script>
    <style>body{font-family:'Noto Sans KR',sans-serif;}.fade-in{animation:fadeIn 0.5s ease forwards;}@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}} input[type="radio"]:checked+label{border-color:#14b8a6;background-color:#f0fdf8;color:#0f766e;}</style>
</head>
<body class="bg-mint-100 min-h-screen flex flex-col">

    <header class="bg-white border-b border-mint-200 sticky top-0 z-10">
        <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button onclick="history.back()" class="w-9 h-9 rounded-full bg-white hover:bg-mint-50 flex items-center justify-center text-mint-600 transition-colors">⬅</button>
                <span class="font-bold text-gray-800">기록 수정</span>
            </div>
            <a href="/" class="w-9 h-9 rounded-full bg-white hover:bg-mint-50 flex items-center justify-center text-mint-600 transition-colors">🏠</a>
        </div>
    </header>

    <main class="flex-1 max-w-2xl w-full mx-auto px-4 py-8 flex flex-col gap-5 fade-in">

        <!-- 기분 선택 -->
        <div class="bg-white rounded-2xl shadow-sm border border-mint-200 p-5">
            <p class="text-gray-500 text-sm mb-4">기분을 수정해주세요</p>
            <div class="grid grid-cols-5 gap-2">
                <div class="flex flex-col items-center gap-1">
                    <input type="radio" name="mood" id="vg" value="VERY_GOOD" class="hidden">
                    <label for="vg" class="w-full flex flex-col items-center gap-1 p-2 rounded-xl border border-gray-100 cursor-pointer transition-all text-center">
                        <span class="text-2xl">😄</span><span class="text-xs text-gray-500">매우좋음</span>
                    </label>
                </div>
                <div class="flex flex-col items-center gap-1">
                    <input type="radio" name="mood" id="g" value="GOOD" class="hidden">
                    <label for="g" class="w-full flex flex-col items-center gap-1 p-2 rounded-xl border border-gray-100 cursor-pointer transition-all text-center">
                        <span class="text-2xl">🙂</span><span class="text-xs text-gray-500">좋음</span>
                    </label>
                </div>
                <div class="flex flex-col items-center gap-1">
                    <input type="radio" name="mood" id="n" value="NORMAL" class="hidden">
                    <label for="n" class="w-full flex flex-col items-center gap-1 p-2 rounded-xl border border-gray-100 cursor-pointer transition-all text-center">
                        <span class="text-2xl">😐</span><span class="text-xs text-gray-500">보통</span>
                    </label>
                </div>
                <div class="flex flex-col items-center gap-1">
                    <input type="radio" name="mood" id="b" value="BAD" class="hidden">
                    <label for="b" class="w-full flex flex-col items-center gap-1 p-2 rounded-xl border border-gray-100 cursor-pointer transition-all text-center">
                        <span class="text-2xl">😕</span><span class="text-xs text-gray-500">나쁨</span>
                    </label>
                </div>
                <div class="flex flex-col items-center gap-1">
                    <input type="radio" name="mood" id="vb" value="VERY_BAD" class="hidden">
                    <label for="vb" class="w-full flex flex-col items-center gap-1 p-2 rounded-xl border border-gray-100 cursor-pointer transition-all text-center">
                        <span class="text-2xl">😢</span><span class="text-xs text-gray-500">매우나쁨</span>
                    </label>
                </div>
            </div>
            <p id="moodError" class="hidden text-red-400 text-xs mt-2 text-center">기분을 선택해주세요.</p>
        </div>

        <!-- 메모 -->
        <div class="bg-white rounded-2xl shadow-sm border border-mint-200 p-5">
            <p class="text-gray-500 text-sm mb-3">메모</p>
            <textarea id="memo" rows="3"
                class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-800 placeholder-gray-300 focus:outline-none focus:border-mint-400 focus:ring-2 focus:ring-mint-100 transition resize-none"></textarea>
        </div>

        <!-- 태그 -->
        <div class="bg-white rounded-2xl shadow-sm border border-mint-200 p-5">
            <p class="text-gray-500 text-sm mb-3">태그</p>
            <input type="text" id="tagText"
                class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-800 placeholder-gray-300 focus:outline-none focus:border-mint-400 focus:ring-2 focus:ring-mint-100 transition"/>
            <p class="text-gray-300 text-xs mt-2">쉼표로 구분해서 입력하세요</p>
        </div>

        <!-- 버튼 -->
        <button onclick="submitEdit()" class="w-full bg-mint-500 hover:bg-mint-600 text-white font-semibold py-3 rounded-xl transition-colors text-sm">
            수정 완료
        </button>
        <p id="submitError" class="hidden text-red-400 text-xs text-center">수정에 실패했습니다. 다시 시도해주세요.</p>
        <a id="cancelLink" href="/mood/list.html" class="w-full text-center text-sm text-gray-400 hover:text-gray-600 py-2">취소</a>

    </main>

    <script src="/js/auth.js"></script>
    <script>
        const token = localStorage.getItem("accessToken");
        const id = new URLSearchParams(window.location.search).get("id");
        if (!token) { location.href = "/login.html"; }

        document.getElementById("cancelLink").href = `/mood/view.html?id=${id}`;

        fetchWithAuth(`/api/mood/view/${id}`)
        .then(res => res.json())
        .then(data => {
            const radio = document.querySelector(`input[name="mood"][value="${data.mood}"]`);
            if (radio) radio.checked = true;
            document.getElementById("memo").value = data.memo || "";
            document.getElementById("tagText").value = data.tagText || "";
        });

        function submitEdit() {
            const selectedMood = document.querySelector('input[name="mood"]:checked');
            const moodError = document.getElementById("moodError");
            if (!selectedMood) { moodError.classList.remove("hidden"); return; }
            moodError.classList.add("hidden");

            fetchWithAuth(`/api/mood/edit/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ mood: selectedMood.value, memo: document.getElementById("memo").value, tagText: document.getElementById("tagText").value })
            })
            .then(res => { if (!res.ok) throw new Error("수정 실패"); return res.json(); })
            .then(() => { location.href = `/mood/view.html?id=${id}`; })
            .catch(() => { document.getElementById("submitError").classList.remove("hidden"); });
        }
    </script>
</body>
</html>
