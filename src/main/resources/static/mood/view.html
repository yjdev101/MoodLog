<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기록 상세보기 - MoodLog</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>tailwind.config={theme:{extend:{colors:{mint:{50:'#f0fdf8',100:'#ccfbee',200:'#99f6dd',300:'#5eead4',400:'#2dd4bf',500:'#14b8a6',600:'#0d9488',700:'#0f766e'}},fontFamily:{sans:['Noto Sans KR','sans-serif']}}}}</script>
    <style>body{font-family:'Noto Sans KR',sans-serif;}.fade-in{animation:fadeIn 0.5s ease forwards;}@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}</style>
</head>
<body class="bg-mint-100 min-h-screen flex flex-col">

    <header class="bg-white border-b border-mint-200 sticky top-0 z-10">
        <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button onclick="history.back()" class="w-9 h-9 rounded-full bg-white hover:bg-mint-50 flex items-center justify-center text-mint-600 transition-colors">⬅</button>
                <span class="font-bold text-gray-800">기록 상세보기</span>
            </div>
            <div class="flex items-center gap-2">
                <a id="editLink" href="#" class="text-sm text-mint-600 font-medium hover:underline">수정</a>
                <a href="/" class="w-9 h-9 rounded-full bg-white hover:bg-mint-50 flex items-center justify-center text-mint-600 transition-colors">🏠</a>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-2xl w-full mx-auto px-4 py-8 flex flex-col gap-4 fade-in">

        <!-- 기분 카드 -->
        <div class="bg-white rounded-2xl shadow-sm border border-mint-200 p-6 flex flex-col items-center gap-2">
            <p id="moodEmoji" class="text-5xl"></p>
            <p id="mood" class="text-gray-800 font-bold text-xl"></p>
            <p id="date" class="text-gray-400 text-sm"></p>
        </div>

        <!-- 메모 카드 -->
        <div class="bg-white rounded-2xl shadow-sm border border-mint-200 p-5">
            <p class="text-gray-400 text-sm mb-2">메모</p>
            <p id="memo" class="text-gray-700 leading-relaxed text-sm"></p>
        </div>

        <!-- 태그 카드 -->
        <div class="bg-white rounded-2xl shadow-sm border border-mint-200 p-5">
            <p class="text-gray-400 text-sm mb-3">태그</p>
            <div id="tags" class="flex flex-wrap gap-2"></div>
        </div>

    </main>

    <!-- 하단 네비게이션 -->
    <nav class="bg-white border-t border-gray-100 sticky bottom-0 md:hidden">
        <div class="max-w-2xl mx-auto px-4 py-2 flex justify-around">
            <a href="/" class="flex flex-col items-center gap-1 text-gray-400 hover:text-mint-500 transition-colors"><span class="text-xl">🏠</span><span class="text-xs">홈</span></a>
            <a href="/mood/write.html" class="flex flex-col items-center gap-1 text-gray-400 hover:text-mint-500 transition-colors"><span class="text-xl">✏️</span><span class="text-xs">기록</span></a>
            <a href="/mood/list.html" class="flex flex-col items-center gap-1 text-mint-500"><span class="text-xl">📋</span><span class="text-xs font-medium">목록</span></a>
            <a href="/mypage.html" class="flex flex-col items-center gap-1 text-gray-400 hover:text-mint-500 transition-colors"><span class="text-xl">👤</span><span class="text-xs">마이</span></a>
        </div>
    </nav>

    <script src="/js/auth.js"></script>
    <script>
        const token = localStorage.getItem("accessToken");
        const id = new URLSearchParams(window.location.search).get("id");
        if (!token) { location.href = "/login.html"; }

        const moodData = {
            VERY_GOOD: { label:"매우좋음", emoji:"😄" },
            GOOD:      { label:"좋음",     emoji:"🙂" },
            NORMAL:    { label:"보통",      emoji:"😐" },
            BAD:       { label:"나쁨",      emoji:"😕" },
            VERY_BAD:  { label:"매우나쁨",  emoji:"😢" }
        };

        fetchWithAuth(`/api/mood/view/${id}`)
        .then(res => res.json())
        .then(data => {
            const m = moodData[data.mood] || { label: data.mood, emoji:"😐" };
            document.getElementById("moodEmoji").innerText = m.emoji;
            document.getElementById("mood").innerText = m.label;
            document.getElementById("date").innerText = data.recordDate;
            document.getElementById("memo").innerText = data.memo || "메모가 없습니다.";

            // 오늘 기록만 수정 버튼 표시
            const today = new Date().toISOString().split("T")[0];
            const editLink = document.getElementById("editLink");
            if (data.recordDate === today) {
                editLink.href = `/mood/edit.html?id=${id}`;
            } else {
                editLink.style.display = "none"; // 수정 버튼 숨기기
            }

            const tagsDiv = document.getElementById("tags");
            (data.tagText || "").split(",").filter(t => t.trim()).forEach(tag => {
                const span = document.createElement("span");
                span.className = "bg-mint-50 text-mint-700 text-xs px-3 py-1 rounded-full border border-mint-200";
                span.innerText = "# " + tag.trim();
                tagsDiv.appendChild(span);
            });
        });
    </script>
</body>
</html>
